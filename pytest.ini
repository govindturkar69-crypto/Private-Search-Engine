[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -m "not e2e and not performance and not slow"
markers =
    unit: Fast deterministic unit tests
    integration: End-to-end integration workflow tests
    e2e: End-to-end headless browser tests
    security: Automated security regression and hardening tests
    performance: Performance latency and throughput benchmark tests
    slow: Long-running or heavy tests
