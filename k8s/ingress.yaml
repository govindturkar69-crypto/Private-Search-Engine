apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-engine-ingress
  labels:
    app: search-engine
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Block external access to /metrics endpoint at Ingress layer
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        return 404;
      }
spec:
  tls:
    - hosts:
        - search.example.com
      secretName: search-engine-tls
  rules:
    - host: search.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: search-engine-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-engine-service
                port:
                  number: 8000

