version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-engine-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ADMIN_TOKEN=${ADMIN_TOKEN:-production_secret_token_at_least_16_chars}
      - DATABASE_PATH=/app/data/index.db
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=100
      - ENABLE_HSTS=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; res = urllib.request.urlopen('http://localhost:8000/health', timeout=5); sys.exit(0 if res.getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - search-engine-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: search-engine-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - api
    networks:
      - search-engine-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: search-engine-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - search-engine-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  search-engine-net:
    driver: bridge

