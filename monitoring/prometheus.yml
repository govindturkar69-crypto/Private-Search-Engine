global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'search-engine-api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:8000']
        labels:
          app: 'search-engine'
          env: 'production'

