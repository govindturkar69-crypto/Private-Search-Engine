name: CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # Job 1: Mandatory Quality Gates & Verification
  # ===========================================================================
  test:
    name: Quality Gates & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-security.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Python Code Formatting Check (Black)
        run: |
          black --check src/ tests/ scripts/

      - name: Python Linting (Flake8 88-char ceiling)
        run: |
          flake8 --max-line-length=88 src/ tests/ scripts/

      - name: Python Type Checking (Mypy)
        run: |
          mypy src scripts

      - name: Security AST Audit
        run: |
          python scripts/security_ast_audit.py

      - name: Secret Leak Scan
        run: |
          python scripts/security_secret_scan.py

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt || echo "::warning::pip-audit identified dependency advisories triaged in docs/10_SECURITY.md"

      - name: Backend Test Suite & Coverage Gate (>= 80%)
        run: |
          pytest tests/ --cov=src --cov-fail-under=80 -m "not performance and not e2e" -v

      - name: Frontend Quality Gates (Vitest, Types, Build)
        run: |
          cd frontend
          npm ci
          npm run test
          npm run type-check
          npm run build

      - name: Playwright E2E Tests
        run: |
          bash scripts/run_e2e_tests.sh

  # ===========================================================================
  # Job 2: Multi-Stage Container Build & Verification
  # ===========================================================================
  build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: search-engine:test

      - name: Container Smoke Test
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e ADMIN_TOKEN="ci_test_token_at_least_16_characters" \
            search-engine:test
          
          # Wait for container startup and verify health endpoint
          timeout=30
          until [ $timeout -le 0 ] || curl -sf http://localhost:8000/health; do
            echo "Waiting for container to become healthy ($timeout s remaining)..."
            sleep 2
            timeout=$((timeout - 2))
          done
          
          if [ $timeout -le 0 ]; then
            echo "Container startup timed out."
            docker logs test-api
            docker rm -f test-api
            exit 1
          fi
          
          # Check metrics endpoint
          curl -sf http://localhost:8000/metrics | grep -q "http_requests_total"
          docker rm -f test-api

      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Production Image to GHCR
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  # ===========================================================================
  # Job 3: Controlled Production Kubernetes Rollout
  # ===========================================================================
  deploy:
    name: Production Deployment Rollout
    runs-on: ubuntu-latest
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        id: kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG secret is not configured. Skipping Kubernetes deployment rollout."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            mkdir -p $HOME/.kube
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Storage & Configuration
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/networkpolicy.yaml

      - name: Rollout Application Deployment
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          # Apply deployment and trigger rollout
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/search-engine-deployment \
            search-engine-api=ghcr.io/${{ github.repository }}:${{ github.sha }} --record
          
          # Await deployment rollout completion (single-replica Recreate strategy)
          if ! kubectl rollout status deployment/search-engine-deployment --timeout=180s; then
            echo "Rollout failed! Initiating rollback..."
            kubectl rollout undo deployment/search-engine-deployment
            exit 1
          fi

      - name: Apply Ingress Routing
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          kubectl apply -f k8s/ingress.yaml

      - name: Post-Deployment Smoke Test
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          python scripts/production_smoke_test.py --base-url "${{ secrets.PRODUCTION_BASE_URL || 'https://search.example.com' }}"
